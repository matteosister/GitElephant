name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
        symfony:
          - 6.*
          - 7.*
          - 8.*
        dependency-version:
          # - prefer-lowest
          - prefer-stable
        exclude:
          - {php: "8.1", symfony: "7.*"}
          - {php: "8.1", symfony: "8.*"}
          - {php: "8.2", symfony: "8.*"}
          - {php: "8.3", symfony: "8.*"}

    name: PHP ${{ matrix.php }} - S ${{ matrix.symfony }} - ${{ matrix.dependency-version }} - tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git --version
          git config --global user.email "test@github.com"
          git config --global user.name "GitHub Action"
          git --version

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install Composer Dependencies
        run: |
          composer require "symfony/process:${{ matrix.symfony }}" "symfony/filesystem:${{ matrix.symfony }}" "symfony/finder:${{ matrix.symfony }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Run PHPUnit Tests
        run: composer tests
