name: Static Tests

on:
  push:
  pull_request:

jobs:
  static_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-progress
      - run: composer static-tests
      - run: composer rector
